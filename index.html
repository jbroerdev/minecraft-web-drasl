<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft – Drasl Login</title><style>html{height:100%;background:#17110b}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.37647)),url('login-dirt.png') repeat;background-size:auto,64px 64px;image-rendering:pixelated;color:#000;font:11px Arial,sans-serif}main{box-sizing:border-box;width:315px;max-width:calc(100vw - 24px);padding:10px 15px 6px;background:#eeecda}h1{width:274px;max-width:100%;height:44px;margin:0 auto 7px;background:url('login-logo.png') center/100% auto no-repeat;image-rendering:auto;font-size:0}label{display:block;margin:0 0 10px;font-weight:bold;line-height:13px}input{display:block;box-sizing:border-box;width:100%;height:20px;margin:0;padding:1px 3px;border:1px solid #7da5cf;background:#fff;color:#000;font:12px Arial,sans-serif;border-radius:0}#login button,#register{display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:100%;height:21px;margin:0 0 7px;padding:0;border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#e5e5df);color:#000;font:11px Arial,sans-serif;text-decoration:none;cursor:pointer;box-shadow:inset 0 0 0 1px #fff}#login button:hover,#register:hover{background:linear-gradient(#fff,#dceafa);border-color:#1269b0}#login button:focus-visible,#register:focus-visible{outline:1px dotted #000;outline-offset:-4px}#login button:disabled{color:#666;cursor:wait}#status{margin:0;line-height:15px;color:#a00000;overflow-wrap:anywhere}#status:empty{display:none}iframe{position:fixed;inset:25px 0 0;width:100%;height:calc(100% - 25px);border:0;background:black}#bar{position:fixed;z-index:10;inset:0 0 auto;height:24px;border-bottom:1px solid #d4d4d4;background:#fafafa;color:#202020;display:flex;align-items:center;gap:2px;padding:0 5px;font:12px "Segoe UI",Tahoma,sans-serif}#bar button,#bar summary{box-sizing:border-box;width:auto;margin:0;padding:3px 8px;border:1px solid transparent;background:transparent;color:inherit;font:inherit;line-height:16px;cursor:default;border-radius:0}#bar button:hover,#bar summary:hover,#bar details[open]>summary{background:#e5f3ff;border-color:#cce8ff}#bar button:focus-visible,#bar summary:focus-visible{outline:1px solid #0078d7;outline-offset:-2px}#bar details{position:relative}#bar summary{list-style:none}#bar summary::-webkit-details-marker{display:none}#bar .menu{position:absolute;top:100%;left:0;min-width:175px;padding:5px;background:#fafafa;border:1px solid #b8b8b8;box-shadow:2px 3px 6px #0002}#bar .menu button{display:block;width:100%;text-align:left}#bar .menu label{margin:0;padding:3px 8px;font:inherit}#bar select{display:block;width:100%;margin-top:5px;padding:3px;font:inherit;color:#202020;background:white;border:1px solid #aaa}#profile{margin-left:auto;padding:0 8px;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} [hidden]{display:none!important}</style><main id="login"><h1 aria-label="Minecraft">Minecraft</h1><form id="form"><label>Drasl username:<input name="username" autocomplete="username" required maxlength="254"></label><label>Password:<input name="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">Login</button><a id="register" href="https://drasl.xserverx.app/" target="_blank" rel="noopener noreferrer">Register</a><p id="status" role="status" aria-live="polite"></p></form></main><nav id="bar" aria-label="Spielmenü" hidden><details><summary>Konto</summary><div class="menu"><button id="logout" type="button">Abmelden</button></div></details><button id="focusGame" type="button">Steuerung aktivieren</button><details><summary>Ansicht</summary><div class="menu"><label>Grafikprofil<select id="performance" aria-label="Grafikprofil"><option value="3">Minimal</option><option value="2" selected>Schnell</option><option value="1">Ausgewogen</option><option value="0">Nativ</option></select></label></div></details><span id="profile"></span></nav><script type="module">
let launchToken=null;
const menus=[...document.querySelectorAll('#bar details')];
for(const menu of menus)menu.addEventListener('toggle',()=>{if(menu.open)for(const other of menus)if(other!==menu)other.open=false;});
document.addEventListener('pointerdown',e=>{for(const menu of menus)if(!menu.contains(e.target))menu.open=false;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')for(const menu of menus)menu.open=false;});
const authHeaders=()=>launchToken?{Authorization:'Bearer '+launchToken}:{};
const performanceSelect=document.querySelector('#performance');
try{const stored=localStorage.getItem('minecraft.performance');if(['0','1','2','3'].includes(stored))performanceSelect.value=stored;}catch{}
performanceSelect.onchange=()=>{for(const menu of menus)menu.open=false;const mode=Number(performanceSelect.value);try{localStorage.setItem('minecraft.performance',String(mode));}catch{}const frame=document.querySelector('iframe');frame?.contentWindow?.postMessage({type:'minecraft-performance',mode},location.origin);document.querySelector('#focusGame').click();};
const form=document.querySelector('#form'),status=document.querySelector('#status'),submit=document.querySelector('#submit');
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;status.textContent='Anmeldung läuft …';try{const response=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();if(!response.ok)throw Error(data.error);form.reset();launchToken=data.launchToken;const gameResponse=await fetch('game.html',{headers:authHeaders(),cache:'no-store'});if(!gameResponse.ok){const error=await gameResponse.json();throw Error(error.error||'Spiel konnte nicht geladen werden.');}const gameMarkup=await gameResponse.text();document.querySelector('#login').hidden=true;document.querySelector('#bar').hidden=false;document.querySelector('#profile').textContent=data.profile.name;const frame=document.createElement('iframe');const gameDocument=new DOMParser().parseFromString(gameMarkup,'text/html');const base=document.createElement('base');base.href=new URL('.',location.href).href;gameDocument.head.prepend(base);frame.srcdoc='<!doctype html>\n'+gameDocument.documentElement.outerHTML;frame.title='Minecraft JS';frame.allow='fullscreen; autoplay; clipboard-write';frame.tabIndex=0;frame.allowFullscreen=true;frame.addEventListener('load',()=>{frame.focus();frame.contentWindow?.focus();});document.body.append(frame);}catch(error){status.textContent=error.message||'Anmeldung fehlgeschlagen.';}finally{submit.disabled=false;}});
document.querySelector('#focusGame').onclick=()=>{const frame=document.querySelector('iframe');if(frame){frame.focus();frame.contentWindow?.focus();frame.contentWindow?.postMessage({type:'minecraft-focus'},location.origin);}};
document.querySelector('#logout').onclick=async()=>{document.querySelector('iframe')?.remove();await fetch('api/logout',{method:'POST',headers:authHeaders()});location.reload();};
</script></html>
